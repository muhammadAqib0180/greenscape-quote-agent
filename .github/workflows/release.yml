name: Release & Deployment Pipeline

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build Release Artifacts & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Release Notes & Changelog Extract
        run: |
          echo "Release Tag: ${{ github.ref_name }}" > release_notes.txt
          cat CHANGELOG.md >> release_notes.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
