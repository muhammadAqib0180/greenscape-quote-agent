name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-format:
    name: Lint & Code Formatter Check (Ruff & Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff & Black
        run: pip install ruff black

      - name: Check Linting (Ruff)
        run: ruff check app/

      - name: Check Formatting (Black)
        run: black --check app/

  sast-security:
    name: Static Security Scanning (Bandit SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit==1.8.5

      - name: Run Bandit SAST scan
        run: bandit -r app/ -c pyproject.toml

  audit-dependencies:
    name: Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from lockfile (reproducible)
        run: pip install -r requirements.lock

      - name: Install pip-audit
        run: pip install pip-audit==2.8.0

      - name: Run pip-audit
        run: pip-audit

  typecheck:
    name: Static Type Check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from lockfile (reproducible)
        run: pip install -r requirements.lock

      - name: Run pyright
        run: pyright app/

  test:
    name: Unit & Integration Tests (pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      GEMINI_API_KEY: fake-key-for-ci
      RENDER_THRESHOLD: "30000"
      PORT: "8000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from lockfile (reproducible)
        run: pip install -r requirements.lock

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  docker-build:
    name: Docker Image Build & Health Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: greenscape-quote-agent:test

      - name: Start container for health check
        run: |
          docker run -d \
            --name gqa-health-check \
            -p 8000:8000 \
            -e APP_ENV=test \
            -e GEMINI_API_KEY=fake-key \
            -e SUPABASE_URL=https://fake.supabase.co \
            -e SUPABASE_KEY=fake-key \
            greenscape-quote-agent:test
          sleep 5

      - name: Verify /healthz liveness endpoint
        run: |
          curl -f --retry 5 --retry-delay 2 http://localhost:8000/healthz \
            || (docker logs gqa-health-check && exit 1)

      - name: Verify /readyz readiness endpoint (APP_ENV=test always 200)
        run: |
          curl -f http://localhost:8000/readyz \
            || (docker logs gqa-health-check && exit 1)

      - name: Stop container
        if: always()
        run: docker rm -f gqa-health-check || true
