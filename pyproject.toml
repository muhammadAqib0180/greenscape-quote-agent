[project]
name = "quoteflow-pro"
version = "1.0.0"
description = "QuoteFlow Pro — Autonomous AI Proposal Accelerator for High-Ticket Trade Contractors"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E501", "S101"]  # line-too-long handled by formatter, allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.bandit]
targets = ["app"]
skips = ["B101"]
exclude_dirs = ["tests", ".venv"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
ignore = ["tests/"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]


